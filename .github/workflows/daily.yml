# tcgcsv rebuilds around 20:00 UTC; this runs after it, once a day.
name: nightly

on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run
        run: python3 update.py
      - name: Commit if anything changed
        run: |
          git config user.name "nightly"
          git config user.email "nightly@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "$(date -u +%Y-%m-%d)"
            git push
          fi
