# tcgcsv rebuilds around 20:00 UTC; this runs after it, once a day.
# 1. catalog: rebuild the card lists and price maps, publish when changed
#    (catalog/build.py). A failed build keeps yesterday's catalog.
# 2. history: record today's TCGplayer prices (update.py), joined by the
#    catalog's per-version pairs.
name: nightly

on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Publish the catalog even if unchanged"
        type: boolean
        default: false

# Actions and Pillow pinned to exact versions: this job publishes what the
# King of OP apps and site download.
permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - name: Catalog
        id: catalog
        continue-on-error: true
        run: |
          pip install --quiet pillow==12.2.0
          python3 catalog/build.py ${{ inputs.force && '--force' || '' }}
      - name: History
        run: python3 update.py
      - name: Commit if anything changed
        run: |
          git config user.name "nightly"
          git config user.email "nightly@users.noreply.github.com"
          git add data catalog/*.json
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "$(date -u +%Y-%m-%d)"
            git push
          fi
      - name: Catalog build failed
        if: steps.catalog.outcome == 'failure'
        run: |
          echo "::error::Catalog build failed; yesterday's catalog is still published."
          exit 1
